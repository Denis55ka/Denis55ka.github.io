<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Политика конфиденциальности · Privacy Policy — D-Konnect</title>
  <meta name="description" content="Политика конфиденциальности приложения D-Konnect — выбор языка. Privacy Policy for the D-Konnect app — choose a language.">
  <link rel="canonical" href="https://denis55ka.app/dkonnect/privacy/">
  <link rel="alternate" hreflang="ru" href="https://denis55ka.app/dkonnect/privacy/ru/">
  <link rel="alternate" hreflang="en" href="https://denis55ka.app/dkonnect/privacy/en/">
  <link rel="alternate" hreflang="x-default" href="https://denis55ka.app/dkonnect/privacy/">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>

  <!--
    Страница выбора языка, а не голый редиректор. Ссылки видны всегда, скрипт лишь
    опережает читателя: при выключенном JavaScript это остаётся рабочей страницей,
    а не тупиком. В магазины и в приложение подаются прямые адреса /ru/ и /en/ —
    этот адрес нигде как юридический не указывается.
  -->

  <main class="home">
    <div class="home__inner">

      <div class="home__name"><span class="brand__dot"></span>D-Konnect</div>
      <p class="home__role">Политика конфиденциальности · Privacy Policy</p>

      <ul class="choose">
        <li>
          <a href="ru/" lang="ru">
            <span class="choose__lang">Русский</span>
            <span class="choose__note">Русская редакция документа</span>
          </a>
        </li>
        <li>
          <a href="en/" lang="en">
            <span class="choose__lang">English</span>
            <span class="choose__note">English version of the document</span>
          </a>
        </li>
      </ul>

      <div class="home__foot">
        <a href="/">denis55ka.app</a>
        <a href="mailto:legal@denis55ka.app">legal@denis55ka.app</a>
      </div>

    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var list = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];

      var target = null;

      for (var i = 0; i < list.length && !target; i++) {
        var code = String(list[i]).toLowerCase();
        if (code.indexOf("ru") === 0) target = "ru/";
        else if (code.indexOf("en") === 0) target = "en/";
      }

      // replace, а не переход: иначе кнопка «назад» возвращала бы сюда
      // и тут же уводила обратно.
      location.replace(target || "en/");
    })();
  </script>

</body>
</html>
